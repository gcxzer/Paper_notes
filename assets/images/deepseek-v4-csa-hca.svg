<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 820" role="img" aria-labelledby="title desc">
  <title id="title">CSA HCA mechanism notes</title>
  <desc id="desc">Mechanism notes for CSA, HCA, sliding window, and attention sink.</desc>
  <style>
    .bg{fill:#fffdf8}.panel{fill:#fffdf8;stroke:#d9d0c2;stroke-width:2;rx:14}.hot{fill:#e7f3ef;stroke:#1d6f6a;stroke-width:3;rx:14}.warn{fill:#fbf0de;stroke:#c49a55;stroke-width:2;rx:14}.tok{fill:#ded6ca}.ctok{fill:#1d6f6a}.win{fill:#8fd6d2}.line{stroke:#1d6f6a;stroke-width:3;fill:none;marker-end:url(#a)}.thin{stroke:#6d655b;stroke-width:2;fill:none;stroke-dasharray:6 6}.ink{fill:#23211d}.muted{fill:#6d655b}.h{font-size:30px;font-weight:850}.k{font-size:17px;font-weight:850}.m{font-size:15px}.tiny{font-size:13px}.math{font-size:15px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.white{fill:#fffdf8}text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  </style>
  <defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0,0 L11,4 L0,8 Z" fill="#1d6f6a"/></marker></defs>
  <rect class="bg" width="1280" height="820"/>
  <text class="h ink" x="54" y="64">2.3 CSA / HCA：把长历史拆成三种记忆</text>
  <text class="m muted" x="54" y="96">exact local memory（窗口） + selected compressed memory（CSA） + global coarse memory（HCA）</text>

  <rect class="panel" x="58" y="140" width="552" height="285"/>
  <text class="k ink" x="86" y="178">CSA：compress → index → top-k → MQA</text>
  <text class="math muted" x="86" y="205">m tokens -> 1 compressed KV; select top-k entries</text>
  <g transform="translate(85 245)">
    <rect class="tok" x="0" y="0" width="24" height="24" rx="4"/><rect class="tok" x="30" y="0" width="24" height="24" rx="4"/><rect class="tok" x="60" y="0" width="24" height="24" rx="4"/><rect class="tok" x="90" y="0" width="24" height="24" rx="4"/>
    <rect class="tok" x="130" y="0" width="24" height="24" rx="4"/><rect class="tok" x="160" y="0" width="24" height="24" rx="4"/><rect class="tok" x="190" y="0" width="24" height="24" rx="4"/><rect class="tok" x="220" y="0" width="24" height="24" rx="4"/>
    <rect class="tok" x="260" y="0" width="24" height="24" rx="4"/><rect class="tok" x="290" y="0" width="24" height="24" rx="4"/><rect class="tok" x="320" y="0" width="24" height="24" rx="4"/><rect class="tok" x="350" y="0" width="24" height="24" rx="4"/>
    <text class="tiny muted" x="188" y="-15" text-anchor="middle">原始 KV tokens</text>
    <path class="line" d="M188 42 V88"/>
    <rect class="ctok" x="35" y="105" width="72" height="34" rx="8"/><rect class="ctok" x="154" y="105" width="72" height="34" rx="8"/><rect class="ctok" x="273" y="105" width="72" height="34" rx="8"/>
    <text class="white tiny" x="71" y="127" text-anchor="middle">block 1</text><text class="white tiny" x="190" y="127" text-anchor="middle">block 2</text><text class="white tiny" x="309" y="127" text-anchor="middle">block 3</text>
    <path class="line" d="M345 122 H438"/><rect class="hot" x="438" y="92" width="82" height="60"/><text class="tiny ink" x="479" y="117" text-anchor="middle">top-k</text><text class="tiny muted" x="479" y="138" text-anchor="middle">selected</text>
  </g>
  <text class="m muted" x="86" y="385">风险：indexer 漏选关键块会丢远程证据；补丁：局部窗口不压缩。</text>

  <rect class="panel" x="670" y="140" width="552" height="285"/>
  <text class="k ink" x="698" y="178">HCA：heavy compression，保全局背景</text>
  <text class="math muted" x="698" y="205">m' >> m; many tokens -> one coarse KV entry</text>
  <g transform="translate(708 255)">
    <rect class="tok" x="0" y="0" width="22" height="22" rx="4"/><rect class="tok" x="28" y="0" width="22" height="22" rx="4"/><rect class="tok" x="56" y="0" width="22" height="22" rx="4"/><rect class="tok" x="84" y="0" width="22" height="22" rx="4"/><rect class="tok" x="112" y="0" width="22" height="22" rx="4"/><rect class="tok" x="140" y="0" width="22" height="22" rx="4"/><rect class="tok" x="168" y="0" width="22" height="22" rx="4"/><rect class="tok" x="196" y="0" width="22" height="22" rx="4"/><rect class="tok" x="224" y="0" width="22" height="22" rx="4"/><rect class="tok" x="252" y="0" width="22" height="22" rx="4"/><rect class="tok" x="280" y="0" width="22" height="22" rx="4"/><rect class="tok" x="308" y="0" width="22" height="22" rx="4"/>
    <path class="line" d="M160 40 V88"/><rect class="ctok" x="106" y="105" width="110" height="40" rx="10"/><text class="white tiny" x="161" y="130" text-anchor="middle">coarse memory</text>
    <rect class="win" x="360" y="105" width="120" height="40" rx="10"/><text class="tiny ink" x="420" y="130" text-anchor="middle">sliding window</text>
    <line class="thin" x1="216" y1="126" x2="360" y2="126"/>
  </g>
  <text class="m muted" x="698" y="385">风险：细节损失更大；定位：便宜的全局语境，不负责精确引用。</text>

  <rect class="hot" x="150" y="510" width="980" height="170"/>
  <text class="k ink" x="185" y="550">读法压缩</text>
  <text class="m muted" x="185" y="585">CSA = 远程证据检索；HCA = 全局摘要记忆；sliding window = 最近 token 精确记忆；attention sink = 长序列稳定锚点。</text>
  <text class="m muted" x="185" y="620">关键变量：m 控制 CSA 压缩粒度，m' 控制 HCA 粗粒度，top-k 控制每步检索预算，n_win 控制局部精确窗口。</text>
  <text class="m muted" x="185" y="655">未解风险：压缩后是否损失精确引用？top-k 选择错块时有没有恢复路径？真实 serving overhead 是否被完整计入？</text>
</svg>
