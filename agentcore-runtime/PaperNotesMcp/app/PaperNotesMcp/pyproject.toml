[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "PaperNotesMcp"
version = "0.1.0"
description = "AgentCore MCP Server"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "boto3 >= 1.43.1",
    "botocore >= 1.43.1",
    "mcp >= 1.19.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]
