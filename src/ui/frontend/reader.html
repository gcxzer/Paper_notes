<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Paper Reader</title>
  <script src="scripts/shared/theme.js"></script>
  <script src="scripts/shared/model.js"></script>
  <link rel="stylesheet" href="styles/reader.css?v=no-aws-ui-v1">
</head>
<body>
  <div class="reader-shell">
    <header class="reader-toolbar">
      <a class="toolbar-button" href="index.html">Back</a>
      <div class="reader-title">
        <span id="readerKicker">Paper</span>
        <strong id="readerTitle">Loading...</strong>
      </div>
      <div class="reader-header-actions" role="group" aria-label="Reader side panes">
        <button class="toolbar-button reader-side-toggle pdf-html-tool is-active" type="button" id="htmlPaneToggle" aria-label="Toggle HTML note">HTML</button>
        <button class="toolbar-button reader-side-toggle pdf-ask-tool" type="button" id="askPaneToggle" aria-label="Toggle Ask panel">Ask</button>
      </div>
    </header>

    <main class="reader-layout is-ask-pane-hidden" id="readerLayout">
      <section class="pdf-pane" aria-label="PDF viewer">
        <div class="pdf-tools" aria-label="PDF annotation tools">
          <button class="pdf-tool pdf-sidebar-tool is-active" type="button" id="annotationSidebarToolbarToggle" aria-label="Toggle annotations">Annotations</button>
          <div class="pdf-tool-group" role="group" aria-label="Annotation mode">
            <button class="pdf-tool" type="button" data-pdf-mode="highlight" aria-pressed="false">Highlight</button>
            <button class="pdf-tool" type="button" data-pdf-mode="underline" aria-pressed="false">Underline</button>
            <button class="pdf-tool" type="button" data-pdf-mode="note" aria-pressed="false">Note</button>
          </div>
          <div class="pdf-tool-group pdf-history-tools" role="group" aria-label="Annotation history">
            <button class="pdf-tool pdf-history-tool" type="button" id="annotationUndo" aria-label="Undo annotation mark" title="Undo annotation mark" disabled>↶</button>
            <button class="pdf-tool pdf-history-tool" type="button" id="annotationRedo" aria-label="Redo annotation mark" title="Redo annotation mark" disabled>↷</button>
          </div>
          <div class="pdf-color-group" role="group" aria-label="Annotation color">
            <button class="pdf-color is-active" type="button" data-pdf-color="yellow" aria-label="Yellow"></button>
            <button class="pdf-color" type="button" data-pdf-color="green" aria-label="Green"></button>
            <button class="pdf-color" type="button" data-pdf-color="blue" aria-label="Blue"></button>
            <button class="pdf-color" type="button" data-pdf-color="red" aria-label="Red"></button>
            <button class="pdf-color" type="button" data-pdf-color="purple" aria-label="Purple"></button>
          </div>
          <div class="pdf-page-control" role="group" aria-label="PDF page navigation">
            <span class="pdf-page-label">Page</span>
            <input class="pdf-page-input" id="pdfPageInput" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" value="1" aria-label="PDF page number">
            <span class="pdf-page-total" id="pdfPageTotal">/ 0</span>
          </div>
          <div class="pdf-tool-group" role="group" aria-label="PDF zoom">
            <button class="pdf-tool" type="button" id="zoomOut">−</button>
            <span class="pdf-zoom" id="zoomLabel">100%</span>
            <button class="pdf-tool" type="button" id="zoomIn">+</button>
          </div>
        </div>
        <div class="pdf-body">
          <aside class="pdf-annotation-sidebar" aria-label="PDF annotations">
            <div class="annotation-sidebar-header">
              <strong>Annotations</strong>
              <div class="annotation-sidebar-actions">
                <span id="annotationCount">0</span>
                <button class="annotation-sidebar-toggle" type="button" id="annotationSidebarToggle" aria-label="Collapse annotations">‹</button>
              </div>
            </div>
            <div class="annotation-list" id="annotationList"></div>
          </aside>
          <div class="pdf-viewer" id="pdfViewer" aria-label="PDF pages"></div>
        </div>
        <div class="pdf-link-return" id="pdfLinkReturn" hidden>
          <button class="pdf-link-back" type="button" id="pdfLinkBack" aria-label="Return to previous PDF position">↩ Back</button>
          <button class="pdf-link-dismiss" type="button" id="pdfLinkDismiss" aria-label="Hide return button">×</button>
        </div>
      </section>

      <div class="reader-resizer reader-main-resizer" id="readerResizer" role="separator" aria-label="Resize PDF and note panes" aria-orientation="vertical" tabindex="0"></div>

      <aside class="note-pane" aria-label="Paper note">
        <div class="html-zoom-controls" aria-label="HTML note zoom">
          <button type="button" id="htmlZoomOut" aria-label="Zoom HTML note out">−</button>
          <span id="htmlZoomLabel">100%</span>
          <button type="button" id="htmlZoomIn" aria-label="Zoom HTML note in">+</button>
        </div>
        <article class="note-page" id="notePage"></article>
      </aside>

      <div class="reader-resizer reader-ask-resizer" id="askResizer" role="separator" aria-label="Resize note and Ask panes" aria-orientation="vertical" tabindex="0"></div>

      <aside class="ask-pane" id="askPane" aria-label="Ask Paper Notes Agent">
        <header class="ask-pane-header">
          <button class="ask-icon-button" type="button" id="chatSessionMenuButton" aria-label="Switch session" aria-haspopup="dialog" aria-expanded="false">◫</button>
          <button class="ask-icon-button ask-pane-close" type="button" id="closeAskPane" aria-label="Close Ask panel">×</button>
        </header>
        <div class="ask-session-popover" id="chatSessionPopover" role="dialog" aria-label="Ask sessions" hidden>
          <div class="ask-session-popover-header">
            <strong>Sessions</strong>
            <div class="ask-session-header-actions">
              <button class="ask-session-trash-toggle" type="button" id="toggleChatSessionTrash" aria-pressed="false">Trash</button>
              <button class="ask-session-export" type="button" id="exportChatSession">Export</button>
              <button class="ask-session-new" type="button" id="newChatSession">New chat</button>
            </div>
          </div>
          <label class="ask-session-search">
            <span class="sr-only">Search sessions</span>
            <input id="chatSessionSearch" type="search" placeholder="Search sessions" autocomplete="off">
          </label>
          <div class="ask-session-list" id="chatSessionList"></div>
        </div>
        <div class="ask-messages" id="readerChatMessages" aria-live="polite"></div>
        <p class="ask-error" id="readerChatError" hidden></p>
        <form class="ask-composer" id="readerChatForm">
          <div class="ask-input-row">
            <textarea id="readerChatInput" rows="1" placeholder="Ask anything"></textarea>
            <button class="ask-send" type="submit" id="sendReaderChat">Send</button>
          </div>
        </form>
      </aside>
    </main>

    <main class="reader-error" id="readerError" hidden>
      <p class="error-kicker">Paper not found</p>
      <h1>Could not open this paper.</h1>
      <a class="toolbar-button" href="index.html">Back to library</a>
    </main>
  </div>

  <script src="node_modules/pdfjs-dist/build/pdf.js?v=pdfjs3"></script>
  <script src="scripts/note/app.js?v=annotations-v6"></script>
  <script src="scripts/reader/state.js?v=state-v1"></script>
  <script src="scripts/reader/app.js?v=shared-model-v1"></script>
</body>
</html>
