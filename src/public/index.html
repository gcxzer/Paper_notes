<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Paper Notes</title>
  <script src="assets/scripts/theme.js"></script>
  <link rel="stylesheet" href="assets/styles/site.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar-panel" aria-label="Collections">
      <div class="sidebar-topbar">
        <div>
          <div class="sidebar-kicker">Library</div>
          <h1>Paper Notes</h1>
        </div>
        <button class="icon-button" id="newCategoryButton" type="button" aria-label="New collection">+</button>
      </div>

      <div class="sidebar-search">
        <input id="searchInput" type="search" placeholder="Search notes">
      </div>

      <div class="sidebar-section" id="sidebarSection">
        <div class="section-label">Collections</div>
        <div class="category-list" id="categoryList"></div>
      </div>

      <div class="sidebar-footer">
        <div class="settings-control">
          <button class="settings-button" id="settingsButton" type="button" aria-expanded="false" aria-haspopup="menu">Settings</button>
          <div class="settings-menu" id="settingsMenu" role="menu" hidden>
            <div class="settings-menu-label">Appearance</div>
            <button class="settings-theme-switch" type="button" data-theme-switch role="switch" aria-checked="false">
              <span>
                <span class="settings-theme-title">Theme</span>
                <span class="settings-theme-value" data-theme-switch-label>Dark</span>
              </span>
              <span class="settings-switch-track" aria-hidden="true">
                <span class="settings-switch-thumb"></span>
              </span>
            </button>
          </div>
        </div>
      </div>

    </aside>

    <div class="panel-resizer panel-resizer-left" id="leftResizer" aria-hidden="true"></div>

    <main class="content-panel">
      <header class="content-header">
        <div>
          <div class="content-kicker" id="contentKicker">Collection</div>
          <h2 id="contentTitle">All Notes</h2>
        </div>
        <div class="content-actions">
          <button class="icon-button add-paper-button" id="addPdfButton" type="button" aria-label="Import PDF">+</button>
          <input id="pdfInput" type="file" accept="application/pdf,.pdf" multiple hidden>
          <div class="sort-control">
            <button class="toolbar-button sort-button" id="sortButton" type="button" aria-expanded="false" aria-haspopup="menu">Sort: Newest</button>
            <div class="sort-menu" id="sortMenu" role="menu" hidden>
              <button class="sort-option" type="button" data-sort-mode="date-desc" role="menuitem">Newest first</button>
              <button class="sort-option" type="button" data-sort-mode="date-asc" role="menuitem">Oldest first</button>
              <button class="sort-option" type="button" data-sort-mode="title-asc" role="menuitem">Title A-Z</button>
            </div>
          </div>
        </div>
      </header>

      <div class="library-status" id="libraryStatus"></div>
      <div class="notes-grid" id="notesGrid"></div>
      <p class="empty" id="emptyState">No notes found.</p>
    </main>

    <div class="panel-resizer panel-resizer-right" id="rightResizer" aria-hidden="true"></div>

    <aside class="details-panel" id="detailsPanel" hidden>
      <div class="details-card" id="detailsCard"></div>
    </aside>
  </div>

  <div class="context-menu" id="contextMenu" hidden></div>

  <dialog class="modal" id="categoryDialog">
    <form class="modal-card" id="categoryForm" method="dialog">
      <div class="modal-header">
        <div>
          <div class="modal-eyebrow" id="categoryDialogEyebrow">Collection</div>
          <h3 id="categoryDialogTitle">New Collection</h3>
        </div>
        <button class="icon-button" type="button" id="closeCategoryDialog" aria-label="Close dialog">x</button>
      </div>

      <label class="field">
        <span>Name</span>
        <input id="categoryNameInput" type="text" maxlength="48" autocomplete="off">
      </label>

      <p class="field-error" id="categoryDialogError" hidden></p>

      <div class="modal-actions">
        <button class="toolbar-button" type="button" id="cancelCategoryDialog">Cancel</button>
        <button class="toolbar-button toolbar-button-primary" type="submit">Save</button>
      </div>
    </form>
  </dialog>

  <dialog class="modal" id="confirmDialog">
    <div class="modal-card">
      <div class="modal-header">
        <div>
          <div class="modal-eyebrow">Delete Collection</div>
          <h3 id="confirmDialogTitle">Delete collection</h3>
        </div>
        <button class="icon-button" type="button" id="closeConfirmDialog" aria-label="Close dialog">x</button>
      </div>

      <p class="confirm-copy" id="confirmDialogBody"></p>

      <div class="modal-actions">
        <button class="toolbar-button" type="button" id="cancelConfirmDialog">Cancel</button>
        <button class="toolbar-button toolbar-button-danger" type="button" id="confirmDialogAction">Delete</button>
      </div>
    </div>
  </dialog>

  <dialog class="modal" id="renameNoteDialog">
    <form class="modal-card" id="renameNoteForm" method="dialog">
      <div class="modal-header">
        <div>
          <div class="modal-eyebrow">Paper</div>
          <h3>Rename paper</h3>
        </div>
        <button class="icon-button" type="button" id="closeRenameNoteDialog" aria-label="Close dialog">x</button>
      </div>

      <label class="field">
        <span>Name</span>
        <input id="renameNoteInput" type="text" maxlength="120" autocomplete="off">
      </label>

      <p class="field-error" id="renameNoteError" hidden></p>

      <div class="modal-actions">
        <button class="toolbar-button" type="button" id="cancelRenameNoteDialog">Cancel</button>
        <button class="toolbar-button toolbar-button-primary" type="submit">Save</button>
      </div>
    </form>
  </dialog>

  <dialog class="modal chat-modal" id="chatDialog">
    <form class="modal-card chat-card" id="chatForm" method="dialog">
      <div class="modal-header chat-header">
        <div>
          <div class="modal-eyebrow">Agent</div>
          <h3>Paper Notes Agent</h3>
        </div>
        <button class="icon-button" type="button" id="closeChatDialog" aria-label="Close dialog">x</button>
      </div>

      <div class="chat-messages" id="chatMessages" aria-live="polite"></div>

      <label class="chat-composer">
        <span class="sr-only">Ask Paper Notes Agent</span>
        <textarea id="chatInput" rows="3" placeholder="Ask about your papers and notes"></textarea>
      </label>

      <p class="field-error" id="chatError" hidden></p>

      <div class="modal-actions chat-actions">
        <button class="toolbar-button" type="button" id="clearChatButton">Clear</button>
        <button class="toolbar-button toolbar-button-primary" type="submit" id="sendChatButton">Send</button>
      </div>
    </form>
  </dialog>

  <dialog class="modal" id="messageDialog">
    <div class="modal-card">
      <div class="modal-header">
        <div>
          <div class="modal-eyebrow" id="messageDialogEyebrow">Notice</div>
          <h3 id="messageDialogTitle">Message</h3>
        </div>
        <button class="icon-button" type="button" id="closeMessageDialog" aria-label="Close dialog">x</button>
      </div>

      <p class="confirm-copy" id="messageDialogBody"></p>

      <div class="modal-actions">
        <button class="toolbar-button toolbar-button-primary" type="button" id="messageDialogAction">OK</button>
      </div>
    </div>
  </dialog>

  <script src="assets/scripts/site.js?v=no-aws-ui-v1"></script>
</body>
</html>
