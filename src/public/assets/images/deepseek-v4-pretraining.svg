<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 740" role="img" aria-labelledby="title desc">
  <title id="title">Pre-training note diagram</title>
  <desc id="desc">Pre-training notes organized by data, model setup, training setup, instability fixes, and evaluation.</desc>
  <style>
    .bg{fill:#fffdf8}.card{fill:#fffdf8;stroke:#d9d0c2;stroke-width:2;rx:14}.hot{fill:#e7f3ef;stroke:#1d6f6a;stroke-width:3;rx:14}.warn{fill:#fbf0de;stroke:#c49a55;stroke-width:2;rx:14}.line{stroke:#1d6f6a;stroke-width:3;fill:none;marker-end:url(#a)}.ink{fill:#23211d}.muted{fill:#6d655b}.h{font-size:30px;font-weight:850}.k{font-size:17px;font-weight:850}.m{font-size:15px}.tiny{font-size:13px}text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  </style>
  <defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0,0 L11,4 L0,8 Z" fill="#1d6f6a"/></marker></defs>
  <rect class="bg" width="1280" height="740"/>
  <text class="h ink" x="54" y="64">4. Pre-Training：base model 阶段解决“会不会用长上下文”</text>
  <rect class="card" x="70" y="150" width="210" height="120"/><text class="k ink" x="100" y="188">Data</text><text class="m muted" x="100" y="218">32T+ tokens</text><text class="m muted" x="100" y="243">document packing</text>
  <path class="line" d="M280 210 H350"/><rect class="hot" x="350" y="125" width="250" height="170"/><text class="k ink" x="380" y="163">Model setups</text><text class="m muted" x="380" y="193">Flash：小激活规模，效率优先</text><text class="m muted" x="380" y="218">Pro：大容量，能力优先</text><text class="m muted" x="380" y="243">CSA/HCA 交替 + MoE + MTP</text>
  <path class="line" d="M600 210 H675"/><rect class="card" x="675" y="150" width="220" height="120"/><text class="k ink" x="705" y="188">Training</text><text class="m muted" x="705" y="218">Muon + AdamW 分工</text><text class="m muted" x="705" y="243">FP4/FP8 mixed precision</text>
  <path class="line" d="M895 210 H970"/><rect class="card" x="970" y="150" width="220" height="120"/><text class="k ink" x="1000" y="188">Base Eval</text><text class="m muted" x="1000" y="218">知识 / 推理 / 代码</text><text class="m muted" x="1000" y="243">long context</text>

  <rect class="warn" x="155" y="430" width="430" height="150"/><text class="k ink" x="185" y="468">Anticipatory Routing</text><text class="m muted" x="185" y="500">问题：MoE 路由和 backbone 同步更新导致 loss spike。</text><text class="m muted" x="185" y="528">做法：用历史参数提前计算路由索引；检测 spike 后短回滚触发。</text><text class="m muted" x="185" y="556">笔记：稳定路由，不是提升表达能力的模块。</text>
  <rect class="warn" x="695" y="430" width="430" height="150"/><text class="k ink" x="725" y="468">SwiGLU Clamping</text><text class="m muted" x="725" y="500">问题：激活 outlier 破坏数值稳定性。</text><text class="m muted" x="725" y="528">做法：限制 SwiGLU 数值范围。</text><text class="m muted" x="725" y="556">笔记：大模型训练里的安全阀。</text>
  <path class="line" d="M475 295 C450 350 415 392 370 430"/><path class="line" d="M785 270 C805 340 850 388 910 430"/>
</svg>
