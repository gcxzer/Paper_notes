[project]
name = "paper-notes"
version = "1.1.0"
description = "A local research workspace for reading PDFs, annotating papers, and building HTML notes with an AI assistant."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "beautifulsoup4>=4,<5",
  "matplotlib>=3.8,<4",
  "numpy>=2,<3",
  "openai>=2.21.0,<3",
  "pandas>=2,<3",
  "pillow>=10,<13",
  "pymupdf>=1.24,<2",
  "requests>=2,<3",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.8",
]

[tool.uv]
default-groups = []
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "src/ui"]

[tool.ruff]
line-length = 120
target-version = "py312"
