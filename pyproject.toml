[project]
name = "paper-notes"
version = "2.0.1"
description = "A local research workspace for reading PDFs, annotating papers, and building HTML notes with an AI assistant."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "beautifulsoup4>=4,<5",
  "clip",
  "fastapi>=0.124,<1",
  "httpx>=0.28,<1",
  "llama-cloud>=2.8.0",
  "llama-index>=0.14.22",
  "llama-index-embeddings-clip>=0.6.0",
  "llama-index-embeddings-ollama>=0.9.0",
  "llama-index-retrievers-bm25>=0.7.1",
  "llama-index-vector-stores-qdrant>=0.10.1",
  "langchain>=1.3.4",
  "langchain-deepseek>=1.1.0",
  "langchain-openai>=1.2.2",
  "langgraph>=1.2.4",
  "matplotlib>=3.8,<4",
  "mcp>=1.24,<2",
  "numpy>=2,<3",
  "openai>=2.21.0,<3",
  "openai-codex>=0.1.0b2",
  "pandas>=2,<3",
  "pillow>=10,<13",
  "pymupdf>=1.27.2.3,<2",
  "python-dotenv>=1.2.2",
  "qdrant-client>=1.18.0",
  "requests>=2,<3",
  "uvicorn[standard]>=0.47,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.0",
  "ruff>=0.8",
]

[tool.uv]
default-groups = []
package = false

[tool.uv.sources]
clip = { git = "https://github.com/openai/CLIP.git" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "src/ui"]

[tool.ruff]
line-length = 120
target-version = "py312"
